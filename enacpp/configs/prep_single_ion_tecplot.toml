# Input preparation for the single-ion model (four_population_ts) with tools/tecplot_prep.py,
# all in Tecplot: the same as prep_single_ion.toml, except that step 1 (fix the neutrals) runs as
# the Tecplot macro 1_fix_neutrals.mcr instead of the C++ program ena_fixneutrals. Slower (step 1
# takes about 25 minutes per snapshot instead of under one), with identical results; kept for
# checking the C++ step, or where ena_fixneutrals is not built.
#
#   tec360-env -- python3 enacpp/tools/tecplot_prep.py enacpp/configs/prep_single_ion_tecplot.toml
#
# Paths are relative to the directory the driver is started in (the top directory of the ENA
# code). The macros contain no paths: every file reaches them as a macro variable, so the same
# macros work in any directory and on any machine.

[run]
first_index = 0               # the first snapshot (0 = the first file of the listings below)
# count = 24                  # how many; default: as many as the listings below provide

# ---- inputs of each snapshot: pattern = "...{index:03}...", glob = "..." (sorted by name),
# ---- list = "file with one path per line, in snapshot order", or file = "..." (the same for all)
[input.mhd]
glob = "mhd/3d__var_2_t*.szplt"                 # EXAMPLE: the MHD solutions (.szplt), sorted by name = by time
macro_variable = "MHDFILE"

[input.neutral_source]
glob = "neutrals/3d_var_region0_1_t*_amrex.dat" # EXAMPLE: the neutral solutions, one per MHD solution, same order
macro_variable = "NEUTRALSRC"

[input.grid]
file = "grid/spherical_grid.plt"                # EXAMPLE: the spherical ENA grid that everything is interpolated onto
macro_variable = "GRIDFILE"

# ---- intermediate files (in the work folder; deleted once the snapshot is done)
[work]
dir = "prep_work"
keep = false                                    # true: keep the intermediate files

[work_file.neutral_fixed]
file = "neutral_fixed_{index:03}.szplt"         # written by step 1 (.szplt), read by step 2a
macro_variable = "NEUTRALFIXED"

# ---- the macros, in order. load = "NAME" first loads that input into a new layout, as is done
# ---- by hand before running the macro.
[[step]]
name = "fix neutrals"
load = "neutral_source"
macro = "enacpp/configs/macros/single_ion/1_fix_neutrals.mcr"

[[step]]                                        # steps 2a-2d: your interpolating_files.mcr in four parts,
name = "read neutrals"                          #   each timed on its own
load = "grid"
macro = "enacpp/configs/macros/single_ion/2a_read_neutrals.mcr"

[[step]]
name = "interpolate neutrals"
macro = "enacpp/configs/macros/single_ion/2b_interpolate_neutrals.mcr"

[[step]]
name = "read MHD"
macro = "enacpp/configs/macros/single_ion/2c_read_mhd.mcr"

[[step]]
name = "interpolate MHD"
macro = "enacpp/configs/macros/single_ion/2d_interpolate_mhd.mcr"

[[step]]
name = "calculate files"
macro = "enacpp/configs/macros/single_ion/3_calculate_files.mcr"

# ---- the output files, their macro variables, and what the checks expect
[output]
dir = "time_series"

[grid]                                          # one row per cell in every grid file
ntheta = 30                                     # theta = 0, 6, ..., 174 deg
nphi = 60                                       # phi = 0, 6, ..., 354 deg
nr = 736                                        # r = 2, 4, ..., 1472 AU

[output_file.neutral]
file = "neutral_{index:03}.dat"
macro_variable = "NEUTRALFILE"
kind = "grid"
columns = 8                                     # n, T, i, j, k, theta, phi, r
strip_header = true                             # Tecplot writes a TITLE/VARIABLES/ZONE header; the ENA files have none
theta_index_column = 3                         # the column of the theta index i (1-based)
theta_index_max = 29                            # drop rows with i > 29: the macro grid runs over i = 0-59, and 30-59
                                                #   (theta > 180 deg) repeat the sky (as done by hand)

[output_file.plasma]
file = "plasma_{index:03}.dat"
macro_variable = "PLASMAFILE"
kind = "grid"
columns = 12                                    # n, T, vr, vtheta, vphi, vt, i, j, k, theta, phi, r
strip_header = true
theta_index_column = 7                         # the column of the theta index i (1-based)
theta_index_max = 29                            # drop rows with i > 29: the macro grid runs over i = 0-59, and 30-59
                                                #   (theta > 180 deg) repeat the sky (as done by hand)

[output_file.boundaries]
file = "boundaries_{index:03}.txt"
macro_variable = "BOUNDARYFILE"
kind = "grid"
columns = 10                                    # region, i, j, k, theta, phi, r, Bx, By, Bz
strip_header = true
theta_index_column = 2                         # the column of the theta index i (1-based)
theta_index_max = 29                            # drop rows with i > 29: the macro grid runs over i = 0-59, and 30-59
                                                #   (theta > 180 deg) repeat the sky (as done by hand)

[output_file.streamlines]
file = "streamlines_{index:03}.dat"
macro_variable = "STREAMFILE"
kind = "streamlines"                            # a Tecplot file: its header stays
variables = 19                                  # X, Y, Z, U_x, U_y, U_z, nH, UxH, UyH, UzH, np, tp, vr, vtheta, vphi, vt, theta0, phi0, r0
