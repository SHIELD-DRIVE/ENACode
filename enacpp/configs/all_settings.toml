# =====================================================================================
# all_settings.toml: MASTER RUN CONFIGURATION
# =====================================================================================
# Every setting of the C++ ENA code, with its default, what it does, and which models
# use it. Copy this file,
# change what you need, and run it:
#
#     enacpp/build/ena_run enacpp/configs/my_run.toml
#
# The active values below are the extended single-ion steady-state run of
# run_esi.toml (same results). Switch the model in [model], or switch on the
# time-dependent maps in [time_dependent], without removing anything else:
#  - settings of another model are skipped, with a "note:" line in the log
#    ([region6] and physics.kappa_heliosheath_pui: extended single-ion only;
#    [multi_ion]: multi-ion only);
#  - [time_dependent] is used only with enabled = true.
# Any value can also be changed on the command line, without editing the file:
#     --set section.key=value   (e.g. --set physics.kappa=1.8, repeatable)
#     --bands 3,6   --out DIR   --threads N   --no-legacy
#
# Syntax (TOML): key = value; text in quotes; true/false; arrays [1, 2]; '#' starts a
# comment. A setting left out (or commented out) takes its default. Relative paths are
# relative to THIS file's directory.
#
# To reproduce the results of the original IDL code exactly, use the version 1.x archive
# (faithful mode, [quirks] switches; see CHANGES_FROM_IDL.md); [quirks] is not accepted here.
# =====================================================================================

[run]
output_dir = "cpp_output_esi_v2"   # where maps go (default "output"); --out DIR overrides

[model]
source = "standard"           # "standard" (BU MHD model) or "moscow" (Moscow model: region codes remapped;
                              #   single-ion model only). Default "standard".
populations = "extended_si"   # the ENA model:
                              #   "four_population_ts": single-ion, Kornbleuth+2023
                              #   "extended_si":        extended single-ion:
                              #                         4 neutral populations, ion-neutral relative speed,
                              #                         heliosheath-created PUIs, neutral components
                              #   "multi_ion_inca":     multi-ion, Kornbleuth+2026
                              # Default "four_population_ts". The model also sets the sensor table (below)
                              # and the input column layouts ([inputs]).

[grid]                        # grid points: theta = i*dtheta (i = 0: north pole), phi = j*dphi, r = r_inner + k*dr
dtheta = 6.0                  # deg (default 6); 180 must be a multiple
dphi = 6.0                    # deg (default 6); 360 must be a multiple
dr = 2.0                      # AU (default 2)
r_inner = 2.0                 # AU, radius of k = 0 (default 2)
nr = 736                      # number of radial points (required): 1 + floor((r_outer - r_inner of the model)/dr);
                              #   your model: 1 + floor((1500 - 30)/2) = 736

[integration]
r_lower = 2.0                 # AU, inner edge of the integration window (default 2)
r_upper = 800.0               # AU, outer edge (default 800); also the outermost cell whose survival losses are
                              #   stored by the time-dependent method
# radial_range = 0            # 0: TS to HP; 2: TS outward. Default: 0 for the extended single-ion and multi-ion
                              #   models (their only range), 2 for the single-ion model. Leave it out to get the
                              #   default of the chosen model.

[physics]
survival = true               # survival probability of the ENAs on their way in. Default true.
                              #   Losses are counted in regions 3 and 6 from survival_observer_r outward.
extinction = true             # streamline extinction of the TS populations (Kornbleuth+2021). Default true.
cold_electrons = true         # ion temperature corrected for cold electrons. Default true.
kappa = 1.0                   # kappa of the SW (region 3); <= 1.5 means a Maxwellian. Default 1.
kappa_pui = 1.0               # transmitted PUIs. Default 1.
kappa_ref = 1.0               # reflected PUIs. Default 1.
kappa_ism = 1.0               # beyond the heliopause (single-ion, radial_range 2). Default 1.
kappa_oh = 1.0                # region 6 SW and (default) heliosheath-created PUIs. Default 1.
# kappa_heliosheath_pui = 1.0 # extended single-ion only: heliosheath-created PUIs in region 3.
                              #   Default (left out): kappa_oh (kappaIHS = kappaOH).
survival_observer_r = 100.0   # AU; survival losses are summed from here outward. Default 100.
fitted_esw = true             # SW share of the energy from the TS fits. Default true.
                              #   false: the constant 0.04.
shock_shift = "none"          # shock-frame shift of the transmitted, reflected and SW Maxwellians:
                              #   "none" (default), "scalar" (|v_ENA + u| - v_shock) or "vector".
                              #   Single-ion model only.
ts_detection = "regions"      # how the TS is found along each streamline: "regions" (default: entry into
                              #   region 3/6 from region 4 in boundaries.txt), "mach" (the first point with
                              #   M^2 < 0.64 after a supersonic point, at r < 130 AU) or "moscow_column" (the
                              #   region column of the Moscow model). Multi-ion: "regions" only.
ts_reference = "computed"     # r_TS,V2 that normalizes the TS fits: "computed" (default when a V2 path is given:
                              #   first TS crossing along the V2 trajectory) or "constant" (ts_reference_r).
ts_reference_r = 78.5         # AU, used with ts_reference = "constant". Default 78.5 (82 for the Moscow model).
v2_trajectory_file = "v2_trajectory_sim.txt"   # V2 path (r, theta, phi in the simulation frame); beyond its last
                              #   point extrapolated linearly. Alternative: v2_direction = [theta, phi] (deg),
                              #   a fixed direction. Give one of the two (or neither, with ts_reference "constant").
vshock = "first_below"        # v_shock (shock-frame speed of the DSA PUIs) with ts_detection "regions":
                              #   "first_below" (default: flow speed at the first point past the crossing with
                              #   M^2 < 0.64, the Mach criterion), "downstream" (vshock_offset_cells past the crossing)
                              #   or "crossing" (version 2.0; may give the upstream speed).
vshock_offset_cells = 2.0     # grid cells, for vshock = "downstream". Default 2.
gap_fill_max_passes = 200     # streamline gap fill stops when nothing changes, or after this many passes. Default 200.
unfilled_cells = "error"      # heliosheath (region 3/6) cells the gap fill leaves empty (their connected part of the
                              #   heliosheath has no streamline data): "error" (default) stops at the first one on a line
                              #   of sight; "skip" gives them no ENAs, as the supersonic pockets, and integration
                              #   continues behind them. The run lists the empty cells after the "Gap fill" line.

# ---- Extended single-ion model only: the ions of region 6 (open heliosheath) ----
# Every default reproduces the region-3 treatment. Skipped (with a note) for other models.
[region6]
# kappa_transmitted = 1.0     # default (left out): physics.kappa_pui
# kappa_reflected = 1.0       # default: physics.kappa_ref
# kappa_heliosheath_pui = 1.0 # default: physics.kappa_oh
# kappa_sw = 1.0              # default: physics.kappa_oh
                              # (left out, they follow the physics kappas; uncomment to set region 6 separately)
accelerated_fraction = 0.0    # f, 0 <= f < 1: fraction of the transmitted, reflected, heliosheath PUIs and SW that is
                              #   accelerated (0: none). Default 0.
accelerated_energy_share = 0.0  # e, 0 <= e < 1: their share of the pressure; the rest keep T (1 - e)/(1 - f).
                              #   Density and pressure are conserved. Needs f > 0. Default 0.
accelerated_kappa = 1.6       # kappa of the accelerated ions. Default 1.6.
accelerated_from = "each_population"  # "each_population" (default): each population keeps its own accelerated part
                              #   at (e/f) T_i; "pooled": one population at (e/f) x the density-weighted temperature.
                              #   Written as the component region6_accelerated (legacy tag Acc6).

# ---- Multi-ion model only (defaults shown). Skipped (with a note) for other models. ----
[multi_ion]
belt = true                   # reconnection-region ("INCA belt") populations in region 3. Default true.
belt_r_max = 550.0            # AU; <= 0 removes the radius limit. Default 550.
belt_phi_min = 30.0           # deg; the belt is phi < belt_phi_min or phi > belt_phi_max;
belt_phi_max = 330.0          #   belt_phi_min >= belt_phi_max removes the longitude limit. Defaults 30, 330.
belt_ratio_min = 1.0          # m vA^2 / kT_pu2 at least this. Default 1.
belt_mva2_max = 0.5           # keV, m vA^2 below this. Default 0.5.
belt_accel_frac = 0.00087     # accelerated ions, fraction of the total density. Default 0.00087.
belt_pu2_frac = 0.013         # non-accelerated ions, fraction of the total density. Default 0.013.
belt_t_pu2_factor = 53.0      # their temperatures, x T_pu2. Defaults 53 and 177.
belt_t_sw_factor = 177.0
belt_kappa_pu2 = 8.6          # their kappas. Defaults 8.6 and 8.15.
belt_kappa_sw = 8.15
injection = "line_of_sight"   # DSA injection energy E_l = 1/2 m_p u^2: "line_of_sight" (default: u = SW speed
                              #   at radial index injection_k on the line of sight) or "streamline" (u just upstream
                              #   of the TS, carried along the streamline).
injection_k = 4               # radial index for injection = "line_of_sight" (4: 10 AU). Default 4.
ts_scaling = "compressed"     # TS fits: "compressed" (default: ((r - r_TS,V2) ts_compress + r_TS,V2) / r_TS,V2) or "ratio" (r / r_TS,V2).
# ts_compress = 0.42222       # compression of "compressed": default exactly 38/90; left out to keep it exact
ts_cap = 1.62                 # cap of the scaled TS distance (default 1.62).
vshock_vmin_kms = 215.0       # v_shock: first pu3 speed past the crossing below this (km/s). Default 215.

[bands]
run = [3, 4, 5, 6, 7]         # bands to run (--bands overrides). Default [13]. The extended single-ion model is
                              #   usually run for IBEX-Lo 3-7. Numbering (sensor table): IBEX-Lo 0-7, IBEX-Hi 8-13 (8 unusable),
                              #   INCA/Ultra 14-17 (single-ion), Ultra/INCA 14-20 (multi-ion, extended single-ion).
eres = 10                     # sub-bands per band (energies at the sub-band centres). Default 10.

# ---- Sensor table: the default is set by the model; give only what you want to change ----
# Single-ion: IBEX-Lo/Hi/INCA table. Multi-ion and extended single-ion: IBEX-Lo at the
# CG-corrected central energies (bands 0-7 evaluated at the central energy only), Ultra/INCA 14-20.
# [sensors]
# emin = [...]                # keV, one entry per band (all four arrays must have the same length)
# emax = [...]                # keV
# ecen = [...]                # keV, central energies
# g = [...]                   # geometric factors
# central_first = 14          # bands central_first..central_last are evaluated at the central energy only
# central_last = 20           #   (defaults 14 and 20)
# [sensors.weights]           # sub-band response weights (eres values per band; default: IBEX-Hi 9-13)
# 9 = [...]

[inputs]
dir = "../../secondary_files/input"   # directory of the input files (relative: to this file's directory)
format = "ascii"              # "ascii" (the text files) or "hdf5" (snapshot files made once with ena_convert;
                              #   then give file = "snapshot_000.h5" in [[snapshot]], or the pattern in
                              #   [time_dependent.files]; tools/use_hdf5.py writes this for you)
allow_incomplete = false      # true only for tests on file slices (missing grid cells allowed). Default false.
# Column layouts of the input files: the defaults match each model's files. Override only for files written
# differently, e.g.:
# [inputs.plasma]
# columns = ["n", "T", "vr", "vtheta", "vphi", "vt", "i", "j", "k", "theta", "phi", "r"]   # single-ion/extended SI
# units = ["", "", "km/s", "km/s", "km/s", "km/s", "", "", "", "", "", ""]                # optional, per column
# (sections [inputs.plasma], [inputs.neutral], [inputs.boundaries], [inputs.streamlines]; see README.md)

# ---- Steady-state maps: the snapshot(s) to read ----
# One [[snapshot]] block per snapshot; a steady-state run uses the first (or --snapshot N). Not used by a
# time-dependent run that has [time_dependent.files].
[[snapshot]]
time = 0.0                    # a label for steady-state runs
plasma = "opherwithneutralsplasmafinish.dat"
neutral = "opherwithneutralsnhfinish.dat"
boundaries = "boundaries.txt"
streamlines = "Streamlines/streamlines_kmhd_moscow_n1200_IB2AU_2AU.dat"
# file = "snapshot_000.h5"    # with inputs.format = "hdf5" (instead of the four text files)

# ---- Time-dependent maps (milestone 8): maps per energy band AND per output time window ----
# README.md, "Time-dependent maps", describes the method. All times in years.
[time_dependent]
enabled = false               # true: time-dependent maps from the snapshot series below; false: steady state.
start = 2005.0                # input range: snapshot s covers [start + s dt, start + (s+1) dt), no interpolation
end = 2025.0                  #   in time; (end - start)/dt snapshots must be given.
dt_months = 2                 # snapshot step, or dt = 0.1666667 (years); give one of the two
output_start = 2009.0         # output windows [output_start + w cadence, ... + window) up to output_end
output_end = 2025.0           #   (defaults: start and end; must lie inside [start, end])
cadence = 1.0                 # years, or cadence_months. Default 1.
# window = 1.0                # window length (years, or window_months). Default = cadence.
                              #   E.g. window = 1.0 with cadence_months = 6: 1-year running averages every 6 months.
observer_r_au = 1.0           # observer distance; ENAs travel radially at (2E/m_p)^1/2. Default 1.
coverage_extinction = 0.3     # a line of sight is a region with missing flux in a window when ENAs made before
                              #   `start` are missing and the streamline extinction of those heliosheath cells is
                              #   still >= this (default 0.3, about the cooling length).
coverage_missing_flux = 0.0   # optional second test (0: off, default): also when the missing share of the window's
                              #   band flux (all components, incl. heliosheath-created PUIs) is >= this.
                              #   With the extinction test alone, a line of sight can pass while still missing a
                              #   large share of its flux (your model, band 3: up to about 55%).
include_incomplete_lines = false  # regions with missing flux: false (default) sets their flux to 0; true keeps it.
                              #   Flagged either way (coverage_complete in the .h5 files, MissingFluxFlag .dat files).
memory_gb = 8.0               # memory per MPI rank for the stored data; if all energies do not fit, the energies are
                              #   processed in groups (same results). Default 8.

[time_dependent.files]        # file-name patterns of the snapshot series: {index} = first_index + s,
first_index = 0              #   {index:03} = zero-padded to 3 digits. (Or list [[snapshot]] blocks instead.)
plasma = "time_series/plasma_{index:03}.dat"        # EXAMPLE names
neutral = "time_series/neutral_{index:03}.dat"
boundaries = "time_series/boundaries_{index:03}.txt"
streamlines = "time_series/streamlines_{index:03}.dat"
# file = "snapshot_{index:03}.h5"   # with inputs.format = "hdf5"
